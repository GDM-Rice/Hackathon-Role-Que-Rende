<a href="Tela02-Inicio.dc.html" aria-current="{{centroAtual}}" style="min-height: 60px; border-radius: 16px; background: {{centroFundo}}; box-shadow: inset 0 0 0 1px {{centroBorda}}; font-size: 11px; color: {{centroCor}}; font-weight: {{centroPeso}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">

<g opacity="{{globoLinha}}" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"></circle><ellipse cx="12" cy="12" rx="4" ry="9"></ellipse><path d="M3 12h18M4.5 7.5h15M4.5 16.5h15"></path></g>

</svg>Planeta<span style="width: 4px; height: 4px; border-radius: 50%; background: {{centroCor}}; opacity: {{centroPonto}}"></span></a>
<a href="Tela08-Ajuda.dc.html" aria-current="{{i.ajuda.atual}}" style="min-height: 60px; border-radius: 16px; background: {{i.ajuda.pilula}}; box-shadow: inset 0 0 0 1px {{i.ajuda.borda}}; font-size: 11px; color: {{i.ajuda.texto}}; font-weight: {{i.ajuda.peso}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{i.ajuda.stroke}}" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="{{i.ajuda.fill}}"></circle><circle cx="12" cy="12" r="4" fill="{{i.ajuda.miolo}}"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>Ajuda<span style="width: 4px; height: 4px; border-radius: 50%; background: {{i.ajuda.stroke}}; opacity: {{i.ajuda.ponto}}"></span></a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ativo":{"editor":"enum","default":"inicio","options":["inicio","mapa","luneta","ajuda","financas"]},"tema":{"editor":"enum","default":"claro","options":["claro","escuro"]},"$preview":{"width":390,"height":88}}'>
class Component extends DCLogic {
renderVals() {
var ativo = this.props.ativo ?? 'inicio';
var escuro = (this.props.tema ?? 'claro') === 'escuro';
var t = escuro
? { fundo: '#1C2733', borda: '#2A3644', inativo: '#B9C3CE', centro: '#E6F1FB', centroTexto: '#042C53' }
: { fundo: '#ECEEF1', borda: '#DDE2E8', inativo: '#5E6B78', centro: '#042C53', centroTexto: '#FFFFFF' };
// menu cinza-claro fosco: a aba ativa vira uma pílula branca com a cor da seção
var pb = escuro ? '#FFFFFF' : '#DDE2E8';
var cores = { mapa: ['#3B6D11', '#C0DD97', '#FFFFFF', pb], luneta: ['#3C3489', '#CECBF6', '#FFFFFF', pb], ajuda: ['#185FA5', '#B5D4F4', '#FFFFFF', pb], financas: ['#854F0B', '#FAC775', '#FFFFFF', pb] };
var i = {};
Object.keys(cores).forEach(function (id) {
var on = id === ativo;
i[id] = {
stroke: on ? cores[id][0] : t.inativo,
fill: on ? cores[id][1] : 'none',
texto: on ? cores[id][0] : t.inativo,
pilula: on ? cores[id][2] : 'transparent',
borda: on ? cores[id][3] : 'transparent',
miolo: on ? cores[id][2] : t.fundo,
peso: on ? 700 : 400,
ponto: on ? 1 : 0,
atual: on ? 'page' : 'false'
};
});
var inicio = ativo === 'inicio';
return {
t: t, i: i,
centroFundo: inicio ? '#FFFFFF' : 'transparent',
centroBorda: inicio ? pb : 'transparent',
centroCor: inicio ? '#0F6E56' : t.inativo,
centroPeso: inicio ? 700 : 400,
centroPonto: inicio ? 1 : 0,
centroAtual: inicio ? 'page' : 'false',
globoLinha: inicio ? 0 : 1,
globoCor: inicio ? 1 : 0
};
}
}
</script>
</body>
</html>
