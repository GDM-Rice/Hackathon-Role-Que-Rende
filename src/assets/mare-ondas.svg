<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 380" width="390" height="380" preserveAspectRatio="none" aria-hidden="true">
  <!--
    Terraformar · água da tela Maré (fundo #042C53).
    Animação feita no CSS: #mare-agua sobe (translateY negativo) por 4 s ao inspirar e desce por 6 s ao expirar.
    #onda-frente e #onda-fundo podem deslizar em X para dar movimento leve.
    Com prefers-reduced-motion ou Ajustes > Animações reduzidas: água parada, só o texto "Inspire / Expire" muda.
  -->
  <g id="mare-agua">
    <path id="onda-fundo" d="M0 80 C60 50 120 110 195 80 C270 50 330 110 390 80 V380 H0Z" fill="#185FA5"/>
    <path id="onda-frente" d="M0 120 C70 95 130 145 195 120 C260 95 320 145 390 120 V380 H0Z" fill="#378ADD" opacity="0.55"/>
  </g>
</svg>
