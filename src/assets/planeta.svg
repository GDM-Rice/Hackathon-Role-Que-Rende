<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 230" width="230" height="230" role="img" aria-labelledby="planeta-titulo" id="planeta">
  <!--
    Terraformar · Planeta (molde base, estado do DIA 1)
    Cada camada tem um id fixo. O JS (js/planeta.js) só troca atributos:
      #mar                     fill: #7C8C88 poluído | #3E79A6 limpando | #185FA5 limpo
      #manchas                 opacity: 1 poluído | 0.35 limpando | 0 limpo
      #regiao-<r>              transform: deslocamento (seca/brotando) | translate(0 0) (verde)
      #regiao-<r>-forma        fill: #C48A3A seca | #B5C27A brotando | #639922 verde
                               stroke: #7A4A12 seca/brotando | #3B6D11 verde
      #racha-<r>               opacity: 0.9 seca | 0 nos outros
      #arvores-<r>             opacity: 0 seca | 0.55 brotando | 1 verde
      #rio-<nome>              stroke: #8C6A3A + dasharray "3 3" + 1.2 (seco) | #378ADD + none + 2.4 (correndo)
      #ave-1..3                opacity 0 | 1
      #nuvens                  opacity 0 | 1 (dia de tempestade)
    Regiões <r>: norte, nordeste, centro-oeste, sudeste, sul
    Deslocamento quando seca: norte(-5 -4) nordeste(6 -4) centro-oeste(-2 3) sudeste(6 5) sul(1 8)
    Contorno = rascunho; trocar pela malha de regiões do IBGE simplificada (mesmos ids).
    O <title> abaixo deve ser reescrito pelo JS com o estado atual.
  -->
  <title id="planeta-titulo">Planeta: 0 de 5 regiões do Brasil recuperadas, mar poluído, 0 de 3 rios correndo</title>

  <!-- Oceano / globo -->
  <circle id="mar" cx="115" cy="114" r="113" fill="#7C8C88"/>
  <!-- sombra 2.5D (baixo-direita, luz vem do alto à esquerda) -->
  <clipPath id="clip-globo"><circle cx="115" cy="114" r="113"/></clipPath>
  <path id="sombra-globo" clip-path="url(#clip-globo)" fill-rule="evenodd" fill="#042C53" opacity="0.16" d="M2 114a113 113 0 1 0 226 0a113 113 0 1 0 -226 0Z M-6 102a106 106 0 1 0 212 0a106 106 0 1 0 -212 0Z"/>
  <circle cx="115" cy="114" r="113" fill="none" stroke="#042C53" stroke-opacity="0.25" stroke-width="2"/>
  <!-- brilho -->
  <path d="M40 40 C70 18 120 8 160 20" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10" fill="none" stroke-linecap="round"/>

  <g id="manchas" opacity="1" fill="#4A5363">
    <ellipse cx="200" cy="150" rx="9" ry="4"/>
    <ellipse cx="40" cy="160" rx="11" ry="5"/>
    <ellipse cx="60" cy="182" rx="6" ry="3"/>
    <ellipse cx="190" cy="185" rx="7" ry="3"/>
    <ellipse cx="28" cy="120" rx="5" ry="2.5"/>
  </g>

  <!-- NORTE (meta 5 · 90 dias) -->
  <g id="regiao-norte" transform="translate(-5 -4)">
    <polygon id="regiao-norte-forma" points="15.5,76.5 35,60 37.5,35 50,30 65,20 85,15 105,30 125,20 135,35 145,45 155,45 145,70 150,80 155,95 155,105 135,105 135,90 95,87.5 80,90 85,107.5 60,95 37.5,95 20,85" fill="#C48A3A" stroke="#7A4A12" stroke-width="1.5" stroke-linejoin="round"/>
    <g id="racha-norte" opacity="0.9" stroke="#7A4A12" stroke-width="1" fill="none"><path d="M60 60 l8 6 l-3 7 l7 5"/><path d="M100 50 l6 8 l8 -2"/><path d="M120 80 l-6 7 l4 6"/></g>
    <path id="rio-amazonas" d="M30 58 C55 48 85 52 110 46 C125 43 138 46 150 44" fill="none" stroke="#8C6A3A" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/>
    <g id="arvores-norte" opacity="0" fill="#27500A"><path d="M50 72 l4 -9 l4 9z"/><path d="M68 58 l4 -9 l4 9z"/><path d="M88 42 l4 -9 l4 9z"/><path d="M60 88 l4 -9 l4 9z"/><path d="M100 74 l4 -9 l4 9z"/><path d="M118 62 l4 -9 l4 9z"/><path d="M78 74 l4 -9 l4 9z"/><path d="M128 92 l4 -9 l4 9z"/></g>
  </g>

  <!-- NORDESTE (meta 4 · 60 dias) -->
  <g id="regiao-nordeste" transform="translate(6 -4)">
    <polygon id="regiao-nordeste-forma" points="155,45 165,52.5 185,55 200,65 210,70 210,85 192.5,105 190,125 187,132 155,117.5 155,105 155,95 150,80 145,70" fill="#C48A3A" stroke="#7A4A12" stroke-width="1.5" stroke-linejoin="round"/>
    <g id="racha-nordeste" opacity="0.9" stroke="#7A4A12" stroke-width="1" fill="none"><path d="M170 70 l7 5 l-2 8"/><path d="M180 100 l6 -5 l5 6"/></g>
    <path id="rio-sao-francisco" d="M158 126 C165 116 170 106 178 98 C186 90 196 86 205 82" fill="none" stroke="#8C6A3A" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/>
    <g id="arvores-nordeste" opacity="0" fill="#27500A"><path d="M166 74 l4 -9 l4 9z"/><path d="M184 84 l4 -9 l4 9z"/><path d="M196 78 l4 -9 l4 9z"/><path d="M172 98 l4 -9 l4 9z"/><path d="M166 114 l4 -9 l4 9z"/></g>
  </g>

  <!-- CENTRO-OESTE (meta 3 · 30 dias) -->
  <g id="regiao-centro-oeste" transform="translate(-2 3)">
    <polygon id="regiao-centro-oeste-forma" points="135,90 135,105 155,105 155,117.5 130,135 120,148 110,157 107.5,155 95,140 95,120 85,115 85,107.5 80,90 95,87.5" fill="#C48A3A" stroke="#7A4A12" stroke-width="1.5" stroke-linejoin="round"/>
    <g id="racha-centro-oeste" opacity="0.9" stroke="#7A4A12" stroke-width="1" fill="none"><path d="M100 110 l8 4 l-1 8 l6 4"/><path d="M125 100 l5 7"/></g>
    <g id="arvores-centro-oeste" opacity="0" fill="#27500A"><path d="M104 112 l4 -9 l4 9z"/><path d="M122 124 l4 -9 l4 9z"/><path d="M98 134 l4 -9 l4 9z"/><path d="M112 142 l4 -9 l4 9z"/></g>
  </g>

  <!-- SUDESTE (meta 2 · 14 dias) -->
  <g id="regiao-sudeste" transform="translate(6 5)">
    <polygon id="regiao-sudeste-forma" points="155,117.5 187,132 182.5,142.5 170,155 155,160 145,166.5 120,148 130,135" fill="#C48A3A" stroke="#7A4A12" stroke-width="1.5" stroke-linejoin="round"/>
    <g id="racha-sudeste" opacity="0.9" stroke="#7A4A12" stroke-width="1" fill="none"><path d="M150 135 l6 6 l-2 6"/></g>
    <path id="rio-parana" d="M150 128 C140 138 128 146 118 152" fill="none" stroke="#8C6A3A" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/>
    <g id="arvores-sudeste" opacity="0" fill="#27500A"><path d="M158 140 l4 -9 l4 9z"/><path d="M168 150 l4 -9 l4 9z"/><path d="M146 154 l4 -9 l4 9z"/></g>
  </g>

  <!-- SUL (meta 1 · 7 dias) -->
  <g id="regiao-sul" transform="translate(1 8)">
    <polygon id="regiao-sul-forma" points="120,148 145,166.5 142.5,175 132.5,190 118,208.5 110,195 97,191 115,175 112,167.5 110,157" fill="#C48A3A" stroke="#7A4A12" stroke-width="1.5" stroke-linejoin="round"/>
    <g id="racha-sul" opacity="0.9" stroke="#7A4A12" stroke-width="1" fill="none"><path d="M122 172 l6 6 l-3 7"/></g>
    <g id="arvores-sul" opacity="0" fill="#27500A"><path d="M122 176 l4 -9 l4 9z"/><path d="M116 192 l4 -9 l4 9z"/><path d="M130 186 l4 -9 l4 9z"/></g>
  </g>

  <!-- Céu: aves (1 por pessoa da tripulação, até 3) -->
  <g fill="none" stroke="#042C53" stroke-width="1.6" stroke-linecap="round">
    <path id="ave-1" d="M184 26 q4 -4 8 0 q4 -4 8 0" opacity="0"/>
    <path id="ave-2" d="M200 40 q3 -3 6 0 q3 -3 6 0" opacity="0"/>
    <path id="ave-3" d="M170 40 q3 -3 6 0 q3 -3 6 0" opacity="0"/>
  </g>

  <!-- Dia de tempestade: nuvens e chuva (nunca remove nada) -->
  <g id="nuvens" opacity="0">
    <g fill="#8A94A6"><ellipse cx="78" cy="46" rx="42" ry="16"/><ellipse cx="104" cy="34" rx="28" ry="14"/><ellipse cx="168" cy="92" rx="36" ry="14"/><ellipse cx="146" cy="84" rx="22" ry="11"/></g>
    <g stroke="#4A5363" stroke-width="1.5" stroke-linecap="round"><path d="M64 66 l-3 8"/><path d="M80 66 l-3 8"/><path d="M96 64 l-3 8"/><path d="M156 110 l-3 8"/><path d="M172 110 l-3 8"/></g>
  </g>
</svg>
